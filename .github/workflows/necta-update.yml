name: NECTA menu update

on:
  schedule:
    # BADILISHA MUDA HAPA (muda ni UTC; Tanzania = UTC+3, kwa hiyo toa saa 3)
    #   "0 * * * *"      kila saa 1
    #   "*/30 * * * *"   kila dakika 30   (kiwango cha chini cha GitHub ni dakika 5)
    #   "0 */2 * * *"    kila saa 2
    #   "0 5 * * *"      kila siku saa 5:00 UTC (= saa 8:00 asubuhi Tanzania)
    - cron: "26 * * * *"
  workflow_dispatch:           # pia unaweza kuiendesha mwenyewe: Actions > Run workflow

permissions:
  contents: write

concurrency:
  group: necta-menu-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Orodha ya kurasa na mafaili (resultsFiles) iko juu ya scripts/update-necta.js
      - name: Sasisha menu za NECTA
        run: node --dns-result-order=ipv4first .github/workflows/scripts/update-necta.js

      # Inaendeshwa tu kama hatua ya juu imefeli: inaonyesha mtandao kati ya GitHub na NECTA
      # (DNS, muunganisho, cheti cha TLS). Unaweza kuifuta baada ya tatizo kuisha.
      - name: Uchunguzi wa mtandao (ikifeli tu)
        if: failure()
        continue-on-error: true
        run: |
          echo "--- DNS ---";  getent ahosts www.necta.go.tz || echo "DNS imeshindwa"
          echo "--- curl (IPv4) ---"; curl -4 -sS -v -m 20 -o /dev/null https://www.necta.go.tz/results/view/psle 2>&1 | head -40 || true
          echo "--- curl (IPv6) ---"; curl -6 -sS -v -m 10 -o /dev/null https://www.necta.go.tz/results/view/psle 2>&1 | head -15 || true

      - name: Hifadhi mabadiliko (XML na ripoti)
        if: always()           # ripoti ihifadhiwe hata kama kuna kilichofeli
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Hakuna mabadiliko ya kuhifadhi."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "necta: sasisha menu ($(date -u +'%F %H:%M') UTC)"
          git pull --rebase
          git push
